[package]
name = "keyhive_codec"
version = "0.1.0"
description = "Encoding traits and the Encoded<T> byte container shared by Keyhive crates"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true, features = ["alloc"], optional = true }
thiserror = { workspace = true }

[dev-dependencies]
postcard = { workspace = true, features = ["alloc"] }

[features]
default = ["std"]
std = ["serde?/std", "thiserror/std"]
serde = ["dep:serde"]
# Everything the full test suite needs, including the serde tests.
test_utils = ["serde"]

[lints]
workspace = true
