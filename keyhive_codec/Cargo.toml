[package]
name = "keyhive_codec"
version = "0.1.0"
description = "Encoding traits and the Encoded<T> byte container shared by Keyhive crates"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
arbitrary = { workspace = true, optional = true }
bolero = { workspace = true, optional = true }
bijoux = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
arbitrary = { workspace = true }
bolero = { workspace = true }

[features]
default = ["std"]
std = ["thiserror/std"]
# Property tests for the codec laws, for other crates' test suites.
laws = ["dep:arbitrary", "dep:bolero"]
# Everything the full test suite needs.
test_utils = ["laws"]

[lints]
workspace = true
