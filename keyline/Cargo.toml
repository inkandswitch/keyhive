[package]
name = "keyline"
version = "0.1.0"
description = "Keyline: Keyhive's convergent authority graph of signed delegations and revocations"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
arbitrary = { workspace = true, optional = true }
bijoux = { workspace = true }
bolero = { workspace = true, optional = true }
# `zeroize` clears signing keys on drop and is `no_std`. `fast` (precomputed
# tables) is left to the consumer: it speeds up verification but grows Wasm
# binaries.
ed25519-dalek = { workspace = true, features = ["zeroize"] }
future_form = { workspace = true }
keyhive_codec = { workspace = true }
keyhive_crypto = { workspace = true }
# `rc` because `Certificate` shares its signed form in an `Arc`.
serde = { workspace = true, features = ["alloc", "derive", "rc"], optional = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true, features = ["attributes"] }

[[test]]
name = "signing"
required-features = ["test_utils"]

[dev-dependencies]
arbitrary = { workspace = true }
bolero = { workspace = true }
curve25519-dalek = { workspace = true }
ed25519-dalek = { workspace = true, features = ["fast", "hazmat", "rand_core", "std", "zeroize"] }
futures = { workspace = true }
keyhive_codec = { workspace = true, features = ["laws"] }
keyhive_crypto = { workspace = true, features = ["unchecked"] }
postcard = { workspace = true, features = ["alloc"] }
sha2 = { workspace = true, features = ["std"] }

[features]
default = ["std"]
std = [
  "ed25519-dalek/std",
  "keyhive_codec/std",
  "keyhive_crypto/std",
  "serde?/std",
  "thiserror/std",
  "tracing/std",
]
# `derive(Arbitrary)` needs `std` (see keyhive_crypto).
arbitrary = ["dep:arbitrary", "keyhive_crypto/arbitrary", "std"]
serde = ["dep:serde", "ed25519-dalek/serde", "keyhive_codec/serde", "keyhive_crypto/serde"]
# The fixtures and conformance scenarios, without `std`: what a backend needs to
# run the scenarios in a `no_std` build.
conformance = ["dep:sha2", "ed25519-dalek/hazmat", "keyhive_crypto/unchecked"]
# Everything the full test suite needs: the scenarios plus the generator, the
# oracles, the `bolero` laws, and the serde round-trip tests.
test_utils = ["arbitrary", "conformance", "dep:bolero", "serde"]
