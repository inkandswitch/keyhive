[package]
name = "keyline"
version = "0.1.0"
description = "Keyline: Keyhive's convergent authority graph of signed delegations and revocations"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = { version = "1.5", default-features = false }
ed25519-dalek = { version = "2.1", default-features = false }
keyhive_codec = { version = "0.1.0", path = "../keyhive_codec", default-features = false }
keyhive_crypto = { version = "0.2.1", path = "../keyhive_crypto", default-features = false }

# std-only dependencies
thiserror = { workspace = true, optional = true }
tracing = { version = "0.1.40", default-features = false, features = [
  "attributes",
], optional = true }

serde = { version = "1.0", default-features = false, features = [
  "alloc",
  "derive",
], optional = true }
arbitrary = { workspace = true, optional = true }
bolero = { workspace = true, optional = true }

[dev-dependencies]
arbitrary = { workspace = true }
bolero = { workspace = true }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = { workspace = true }

[features]
default = ["std"]
std = [
  "blake3/std",
  "ed25519-dalek/std",
  "keyhive_codec/std",
  "keyhive_crypto/std",
  "serde?/std",
  "thiserror",
  "tracing",
  "tracing?/std",
]
serde = ["dep:serde", "keyhive_codec/serde"]
arbitrary = ["dep:arbitrary", "keyhive_crypto/arbitrary"]
test_utils = ["dep:bolero"]
