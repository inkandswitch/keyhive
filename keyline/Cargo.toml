[package]
name = "keyline"
version = "0.1.0"
description = "Keyline: Keyhive's convergent authority graph of signed delegations and revocations"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
arbitrary = { workspace = true, optional = true }
bolero = { workspace = true, optional = true }
ed25519-dalek = { version = "2.1", default-features = false }
keyhive_codec = { version = "0.1.0", path = "../keyhive_codec", default-features = false }
keyhive_crypto = { version = "0.2.1", path = "../keyhive_crypto", default-features = false }
serde = { version = "1.0", default-features = false, features = [
  "alloc",
  "derive",
], optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
# TODO(thiserror-2): the workspace pins thiserror 1, which is std-only. Pin 2 here
# (no_std-capable) until the rest of the workspace migrates; then use `workspace = true`.
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1.40", default-features = false, features = [
  "attributes",
] }

[dev-dependencies]
arbitrary = { workspace = true }
bolero = { workspace = true }
curve25519-dalek = "4.1"
divan = "0.1.15"
ed25519-dalek = { version = "2.1", features = ["hazmat", "rand_core"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
sha2 = "0.10"

[features]
default = ["std"]
std = [
  "ed25519-dalek/std",
  "keyhive_codec/std",
  "keyhive_crypto/std",
  "serde?/std",
  "thiserror/std",
  "tracing/std",
]
# `derive(Arbitrary)` needs `std` (see keyhive_crypto).
arbitrary = ["dep:arbitrary", "keyhive_crypto/arbitrary", "std"]
serde = ["dep:serde", "ed25519-dalek/serde", "keyhive_codec/serde"]
# Everything the full test suite needs, including the serde round-trip tests.
test_utils = ["arbitrary", "dep:bolero", "dep:sha2", "ed25519-dalek/hazmat", "serde"]

[[bench]]
name = "bench_evaluate"
harness = false
required-features = ["test_utils"]
