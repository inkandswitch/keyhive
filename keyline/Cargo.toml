[package]
name = "keyline"
version = "0.1.0"
description = "Keyline: Keyhive's convergent authority graph of signed delegations and revocations"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
arbitrary = { workspace = true, optional = true }
blake3 = { version = "1.5", default-features = false }
bolero = { workspace = true, optional = true }
ed25519-dalek = { version = "2.1", default-features = false }
keyhive_codec = { version = "0.1.0", path = "../keyhive_codec", default-features = false }
keyhive_crypto = { version = "0.2.1", path = "../keyhive_crypto", default-features = false }
serde = { version = "1.0", default-features = false, features = [
  "alloc",
  "derive",
], optional = true }
# TODO(thiserror-2): the workspace pins thiserror 1, which is std-only. Pin 2 here
# (no_std-capable) until the rest of the workspace migrates; then use `workspace = true`.
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1.40", default-features = false, features = [
  "attributes",
] }

[dev-dependencies]
arbitrary = { workspace = true }
bolero = { workspace = true }
divan = "0.1.15"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = { workspace = true }

[features]
default = ["std"]
std = [
  "blake3/std",
  "ed25519-dalek/std",
  "keyhive_codec/std",
  "keyhive_crypto/std",
  "serde?/std",
  "thiserror/std",
  "tracing/std",
]
# `derive(Arbitrary)` needs `std` (see keyhive_crypto).
arbitrary = ["dep:arbitrary", "keyhive_crypto/arbitrary", "std"]
serde = ["dep:serde", "ed25519-dalek/serde", "keyhive_codec/serde"]
test_utils = ["dep:bolero", "arbitrary"]

[[bench]]
name = "bench_evaluate"
harness = false
required-features = ["test_utils"]
