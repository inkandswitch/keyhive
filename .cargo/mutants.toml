# cargo-mutants configuration — https://mutants.rs/
#
# `nix run .#ci-mutants` (full sweep) and hosted CI (`--in-diff pr.diff`)
# both read this file.

# keyhive_wasm only runs on wasm32 (its tests need a JS runtime), so its
# mutants cannot be tested by the host `cargo test`. test-utils,
# beekem/src/test_utils.rs, and keyline's test_utils (fixtures, generator,
# conformance suite) are test tooling, not product code.
exclude_globs = [
  "beekem/src/test_utils.rs",
  "keyhive_wasm/**",
  "keyline/src/test_utils.rs",
  "keyline/src/test_utils/**",
  "test-utils/**",
]

# Feature set needed for the full test suite to build.
additional_cargo_args = ["--features", "test_utils"]

# Mutating `Debug`/`Display` impls only produces noisy survivors.
#
# `Context::excludes_an_endpoint` is a shortcut whose answer the following
# search recomputes, so its mutants are equivalent (see its doc comment).
exclude_re = [
  "Context::excludes_an_endpoint",
  "impl (core::|std::)?(fmt::)?(Debug|Display) for",
]

timeout_multiplier = 3.0
