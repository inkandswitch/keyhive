# cargo-mutants configuration — https://mutants.rs/
#
# `nix run .#ci-mutants` (full sweep) and hosted CI (`--in-diff pr.diff`)
# both read this file.

# keyhive_wasm only runs on wasm32 (its tests need a JS runtime), so its
# mutants cannot be tested by the host `cargo test`. test-utils,
# beekem/src/test_utils.rs, keyhive_codec's laws (the harness that perturbs
# encodings for the codec property tests), and keyline's test_utils
# (fixtures, generator, conformance suite) are test tooling, not product
# code.
exclude_globs = [
  "beekem/src/test_utils.rs",
  "keyhive_codec/src/laws.rs",
  "keyhive_wasm/**",
  "keyline/src/test_utils.rs",
  "keyline/src/test_utils/**",
  "test-utils/**",
]

# Feature set needed for the full test suite to build.
additional_cargo_args = ["--features", "test_utils"]

# Mutating `Debug`/`Display` impls only produces noisy survivors.
#
# `Context::excludes_an_endpoint` is a shortcut whose answer the following
# search recomputes, so its mutants are equivalent (see its doc comment).
#
# `Keyhive::keyline` and `Keyhive::sign_certificate` have two definitions,
# public for `test_utils` builds and `pub(crate)` otherwise. Mutants build
# with `test_utils`, so the second copy is never compiled and its mutants are
# missed by construction; both are one-line delegations every test calls.
#
# The one `!=` in `Keyhive::reconcile_locked` only decides whether to log
# that the Keyline store changed outside this keyhive.
#
# `SigningError`'s `From<InvalidIdentifier>` is written by hand only without `std`;
# with it, `thiserror` derives it, so the hand-written one is never compiled.
#
# `Keyhive::subject_views` skips live members and principals that never had
# standing only to save work: a live member's explanation is part of the
# closure it is sent anyway, and a principal with no positive standing has no
# route to explain, so its explanation is empty.
#
# `Arbitrary` impls generate test data: mutating one only changes which
# inputs a property test draws.
#
# `Cgka::apply_batch` applies a single operation, or a batch of only updates,
# in order. The concurrent path builds the same tree for those: it pops a lone
# added leaf and pushes it back in place, `remove_id` has already reclaimed
# trailing blank leaves, and with no adds or removes it changes nothing. So
# routing them through it with `&&` is equivalent.
#
# `uniform_index` accepts a draw `< limit`; `<=` differs only when a draw is
# exactly `limit`, which happens with probability 2^-64 and then still yields an
# index in range (`limit` is a multiple of `len`), so no test can tell them apart.
exclude_re = [
  "<impl From<InvalidIdentifier> for SigningError>::from",
  "Context::excludes_an_endpoint",
  "Keyhive<[^>]*>::(keyline|sign_certificate) ",
  "impl (arbitrary::)?Arbitrary",
  "impl (core::|std::)?(fmt::)?(Debug|Display) for",
  "replace != with == in Keyhive<[^>]*>::reconcile_locked",
  "replace \\|\\| with && in Cgka::apply_batch",
  "replace \\|\\| with && in Keyhive<[^>]*>::subject_views",
  "replace < with <= in uniform_index",
]

timeout_multiplier = 3.0
