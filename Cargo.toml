[workspace]
resolver = "2"
members = [
  "beekem",
  "keyhive_codec",
  "keyhive_content",
  "keyhive_core",
  "keyhive_crypto",
  "keyhive_wasm",
  "keyline",
  "keyline_memory",
  "test-utils",
]

[workspace.package]
authors = [
  "Alex Good <alex@memoryandthought.me>",
  "John Mumm <jtfmumm@gmail.com>",
  "Brooklyn Zelenka <hello@brooklynzelenka.com>",
]

edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/inkandswitch/keyhive"
rust-version = "1.90.0"
version = "0.0.0-alpha.3"

[workspace.dependencies]
# Crates that also build `no_std` turn default features off here; `std` crates
# list what they need, so each version is set once and features stay explicit.
aquamarine = "0.6"
arbitrary = { version = "1.4.1", features = ["derive"] }
# `no_std`; `std` only adds a blocking fallback.
async-lock = { version = "3.4", default-features = false }
base64-simd = "0.8.0"
beekem = { version = "0.7.0", path = "beekem", default-features = false }
bijoux = { version = "0.3", default-features = false, features = ["u32", "u64"] }
blake3 = { version = "1.5", default-features = false }
bolero = { version = "0.11.1", features = ["arbitrary"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
console_error_panic_hook = "0.1"
curve25519-dalek = "4.1"
derivative = "2.2"
derive-where = "1.2"
derive_more = { version = "1.0", default-features = false, features = [
  "debug",
  "deref",
  "display",
  "from",
  "into",
  "try_into",
] }
divan = "0.1.15"
dupe = "0.9.0"
ed25519-dalek = { version = "2.1", default-features = false }
from_js_ref = "0.1.3"
future_form = "0.3.1"
# Defaults off so `no_std` crates can inherit it; crates that want the
# defaults (`std`, `async-await`, `executor`) add them.
futures = { version = "0.3.31", default-features = false, features = ["alloc"] }
getrandom = "0.2"
hex = "0.4.3"
imbl = "7.0"
js-sys = "0.3"
keyhive_codec = { version = "0.1.0", path = "keyhive_codec", default-features = false }
keyhive_content = { version = "0.2.0", path = "keyhive_content", default-features = false }
keyhive_core = { version = "0.10.0", path = "keyhive_core" }
keyhive_crypto = { version = "0.4.0", path = "keyhive_crypto", default-features = false }
keyline = { version = "0.2.0", path = "keyline", default-features = false }
keyline_memory = { version = "0.2.0", path = "keyline_memory", default-features = false }
lazy_static = "1.5"
nonempty = { version = "0.12.0", default-features = false, features = ["serialize"] }
nu-ansi-term = "0.50.1"
num = { version = "0.4.3", features = ["num-bigint"] }
once_cell = { version = "1.21", default-features = false, features = ["alloc", "race"] }
pretty_assertions = "1.4"
prettytable-rs = "0.10.0"
proptest = "1.5"
proptest-derive = "0.5.0"
rand = { version = "0.8.5", default-features = false }
sha2 = { version = "0.10", default-features = false }
signature = "2.2"
test-utils = { path = "test-utils" }
testresult = "0.4.1"
thiserror = { version = "2.0", default-features = false }
tokio = "1.43"
tokio-test = "0.4.4"
tracing = { version = "0.1.41", default-features = false }
tracing-subscriber = "0.3.19"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4.50"
wasm-bindgen-test = "0.3.50"
wasm_refgen = "0.1.5"
# Temporarily using commit with support for `console` logging levels until the next release.
wasm-tracing = { git = "https://github.com/dsgallups/wasm-tracing", rev = "8c9ed933539664119681b896badb2be933338765", version = "2.1.0" }
web-sys = "0.3.81"
x25519-dalek = { version = "2.0", features = [
  "reusable_secrets",
  "static_secrets",
] }

[workspace.lints.clippy]
# Long doc list continuations are indented for reading as plain text.
doc_overindented_list_items = "allow"
# Types are spelled out rather than hidden behind aliases.
type_complexity = "allow"

[profile.release]
lto = true

# Property tests: optimized (the conformance laws evaluate each generated set
# many times), with debug assertions and overflow checks kept on, and no LTO.
[profile.bolero]
inherits = "dev"
opt-level = 3
