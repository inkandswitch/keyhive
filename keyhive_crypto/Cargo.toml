[package]
name = "keyhive_crypto"
version = "0.3.0"
description = "Shared cryptographic primitives for Keyhive"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = { workspace = true }
chacha20poly1305 = { workspace = true }
derive_more = { workspace = true }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
future_form = { workspace = true }
futures = { workspace = true }
keyhive_codec = { workspace = true }
rand = { workspace = true }
signature = { workspace = true }
tracing = { workspace = true, features = ["attributes"] }
x25519-dalek = { workspace = true }

# std-only dependencies
dupe = { workspace = true, optional = true }
thiserror = { workspace = true }

arbitrary = { workspace = true, optional = true }

[dev-dependencies]
arbitrary = { workspace = true }
bolero = { workspace = true }
curve25519-dalek = { workspace = true }
keyhive_codec = { workspace = true, features = ["laws"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = ["std"]
std = [
  "blake3/std",
  "derive_more/std",
  "dupe",
  "ed25519-dalek/std",
  "keyhive_codec/std",
  "rand/std",
  "rand/std_rng",
  "thiserror/std",
  "tracing/std",
]
arbitrary = ["dep:arbitrary", "std"]
# `Verified::assume`, which skips signature checks: for test fixtures only.
unchecked = []
# Everything the full test suite needs. Also the feature hosted CI and
# cargo-mutants pass to every crate: without it, `--features test_utils` fails
# to build this crate and its mutants are never tested.
test_utils = ["arbitrary", "unchecked"]

[lints]
workspace = true
