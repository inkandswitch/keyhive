name: Bolero Tests

# Heavy property-test sweep. The per-PR gate is `ci-bolero` in ci.yml, which
# runs every harness at 1000 iterations on Linux; this workflow exists for the
# two things that gate cannot afford: a much longer sweep, and macOS.
#
# The harnesses live in `keyline`: codec round-trip and canonicality for every
# certificate type, and the conformance laws, which check `MemoryKeyline`
# against two independent oracles, plus order independence, idempotence,
# monotone denial, digest stability, and query consistency.

on:
  schedule:
    # Nightly; offset from :00 to avoid the cron rush.
    - cron: '23 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  property-tests:
    name: ${{ matrix.label }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            iterations: 50000
            label: Thorough
          - os: macos-latest
            iterations: 10000
            label: Quick

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          # Reads rust-toolchain.toml; defer caching to Swatinem below.
          cache: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: bolero-${{ matrix.os }}

      - name: Run property tests (${{ matrix.label }})
        env:
          BOLERO_RANDOM_ITERATIONS: ${{ matrix.iterations }}
          RUST_BACKTRACE: 1
        # The `bolero` profile (workspace Cargo.toml) is optimized, which is
        # what makes a 50k-iteration sweep affordable, and keeps debug
        # assertions and overflow checks on, unlike `--release`.
        run: cargo test --profile bolero --workspace --exclude keyhive_wasm --features test_utils --tests
