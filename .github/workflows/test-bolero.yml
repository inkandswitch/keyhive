name: Bolero Tests

# Heavy property-test sweep. The per-PR gate is `ci-bolero` in ci.yml, which
# runs every harness at 1000 iterations on Linux; this workflow exists for the
# two things that gate cannot afford: a much longer sweep, and macOS.
#
# All 15 harnesses live in `keyline` — codec round-trip and canonicality for
# every certificate type, and the conformance laws, which check `MemoryKeyline`
# against a naive transcription of the evaluation program (with and without
# revocations), plus order independence, idempotence, monotone denial, digest
# stability, and query consistency.

on:
  schedule:
    # Nightly; offset from :00 to avoid the cron rush.
    - cron: '23 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  property-tests:
    name: ${{ matrix.label }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            iterations: 50000
            label: Thorough
          - os: macos-latest
            iterations: 10000
            label: Quick

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Reads rust-toolchain.toml; defer caching to Swatinem below.
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bolero-${{ matrix.os }}

      - name: Run property tests (${{ matrix.label }})
        env:
          BOLERO_RANDOM_ITERATIONS: ${{ matrix.iterations }}
          RUST_BACKTRACE: 1
        # Release: the conformance oracle is ~40x faster optimised, which is
        # what makes a 50k-iteration sweep affordable. The harnesses assert
        # with `assert_eq!`, not `debug_assert!`, so nothing is compiled out.
        run: cargo test --release --workspace --exclude keyhive_wasm --features test_utils --tests
