name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  # Rerun periodically to pick up new queries
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Not a `nix run .#ci-*` app like the rest of CI: the nixpkgs CodeQL CLI lags
# the published query packs and ships extractor binaries unpatched for NixOS.
# The action's bundle keeps CLI and queries in lockstep.
jobs:
  analyze:
    name: ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Neither needs a build: the Rust extractor reads sources via
        # rust-analyzer, and JS/TS is extracted directly.
        language: [javascript-typescript, rust]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          build-mode: none
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config: |
            paths-ignore:
              - '**/node_modules'
              - keyhive_wasm/dist
              - keyhive_wasm/pkg

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
