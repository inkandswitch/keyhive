name: Benchmarks

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # keyhive_core benches use divan (not Criterion): output is a text
        # table on stdout, so we capture it to a file for the artifact.
        bench:
          - bench_cgka
          - bench_cgka_propagation
          - bench_ingest_unsorted_static_events
          - bench_membership_ops_all
          - bench_reachable_prekey_ops
          - bench_reachable_prekey_ops_all
          - bench_reverse_topsort
          - bench_toggling_delegate_revoke

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          # One cache entry for all benches: they share a single package,
          # so per-bench keys would just duplicate the same artifacts.
          shared-key: bench-keyhive_core
          cache-all-crates: true

      - name: Run ${{ matrix.bench }}
        env:
          DIVAN_SORT: name
        # Explicit `bash` gives `-o pipefail`, so a failing bench is not masked by `tee`.
        shell: bash
        run: |
          mkdir -p bench-results
          cargo bench --package keyhive_core --features test_utils \
            --bench ${{ matrix.bench }} \
            | tee "bench-results/${{ matrix.bench }}.txt"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.bench }}
          path: bench-results/
          retention-days: 90
