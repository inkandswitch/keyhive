name: Benchmarks

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # All benches use divan (not Criterion): output is a text table on
        # stdout, so we capture it to a file for the artifact.
        include:
          - { package: keyhive_core, bench: bench_cgka }
          - { package: keyhive_core, bench: bench_cgka_propagation }
          - { package: keyhive_core, bench: bench_event_selection }
          - { package: keyhive_core, bench: bench_ingest_unsorted_static_events }
          - { package: keyhive_core, bench: bench_reachable_prekey_ops }
          - { package: keyhive_core, bench: bench_reachable_prekey_ops_all }
          - { package: keyhive_core, bench: bench_toggling_delegate_revoke }
          - { package: keyline_memory, bench: bench_evaluate }

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # One cache entry per package: benches within a package share
          # artifacts, so per-bench keys would just duplicate them.
          shared-key: bench-${{ matrix.package }}
          cache-all-crates: true

      - name: Run ${{ matrix.package }} ${{ matrix.bench }}
        env:
          DIVAN_SORT: name
        # Explicit `bash` gives `-o pipefail`, so a failing bench is not masked by `tee`.
        shell: bash
        run: |
          mkdir -p bench-results
          cargo bench --package ${{ matrix.package }} --features test_utils \
            --bench ${{ matrix.bench }} \
            | tee "bench-results/${{ matrix.package }}-${{ matrix.bench }}.txt"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ matrix.package }}-${{ matrix.bench }}
          path: bench-results/
          retention-days: 90
