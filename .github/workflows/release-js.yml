name: Publish Package to npmjs

# npm trusted publishing (OIDC) is registered on npmjs.com against this
# filename and the `npm` environment; renaming either breaks publishing.
#
# The build job produces and smoke-tests the tarball with the same Nix
# derivation CI runs on every PR. The publish job holds the OIDC token, runs
# no project code, and uploads that tested tarball unchanged.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Only publish tags starting with keyhive-wasm/; Rust crate releases
    # from this repo are handled separately.
    if: ${{ startsWith(github.ref_name, 'keyhive-wasm/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require a commit merged to main
        run: git merge-base --is-ancestor HEAD origin/main

      # Cheap check first, before the Nix install and Wasm build.
      - name: Verify tag matches package.json version
        working-directory: keyhive_wasm
        run: |
          pkg_version="$(jq -r .version package.json)"
          # Tags look like keyhive-wasm/0.2.0-alpha.1
          tag="${GITHUB_REF_NAME#keyhive-wasm/}"
          if [ "$tag" != "$pkg_version" ]; then
            echo "::error::tag version '$tag' != package.json version '$pkg_version'"
            exit 1
          fi

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Setup Cachix
        uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
        with:
          name: inkandswitch
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build and smoke-test the npm package
        run: nix build .#keyhive-js --no-update-lock-file --print-build-logs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: result/keyhive.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: npm-artifacts

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1.
      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@11.20.0 --ignore-scripts

      # Re-running after a successful publish is a no-op. A failed registry
      # lookup aborts rather than being read as "not yet published".
      - name: Publish (skipped if already published)
        run: |
          set -euo pipefail
          # Absolute: npm reads a bare `dir/file.tgz` as GitHub shorthand.
          tarball="$(realpath npm-artifacts/keyhive.tgz)"
          manifest="$(tar -xOzf "$tarball" package/package.json)"
          name="$(jq -r .name <<<"$manifest")"
          version="$(jq -r .version <<<"$manifest")"
          expected="${GITHUB_REF_NAME#keyhive-wasm/}"
          if [ "$name" != "@keyhive/keyhive" ] || [ "$version" != "$expected" ]; then
            echo "::error::tarball contains $name@$version, expected @keyhive/keyhive@$expected"
            exit 1
          fi

          # `npm view` exits with E404 for a version that does not exist yet,
          # which is the normal case for a new release. Any other failure is
          # a failed lookup and aborts.
          err="$(mktemp)"
          if published="$(npm view "$name@$version" version 2>"$err")"; then
            if [ -n "$published" ]; then
              echo "$name@$version is already published."
              exit 0
            fi
          elif ! grep -q E404 "$err"; then
            cat "$err" >&2
            exit 1
          fi

          # Dist-tag follows the version, not the GitHub "pre-release"
          # checkbox: a semver pre-release goes to `next` so
          # `npm install @keyhive/keyhive` never resolves to an alpha.
          tag_args=()
          if [[ "$version" == *-* ]]; then
            tag_args=(--tag next)
          fi
          npm publish "$tarball" --ignore-scripts --access public --provenance "${tag_args[@]}"
