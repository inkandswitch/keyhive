name: Publish Package to npmjs

# npm trusted publishing (OIDC) is registered on npmjs.com against this
# filename and the `npm` environment; renaming either breaks publishing.
#
# The build job produces and smoke-tests the tarball with the same Nix
# derivation CI runs on every PR. The publish job holds the OIDC token, runs
# no project code, and uploads that tested tarball unchanged.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Only publish tags starting with keyhive-wasm/; Rust crate releases
    # from this repo are handled separately.
    if: ${{ startsWith(github.ref_name, 'keyhive-wasm/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require a commit merged to main
        run: git merge-base --is-ancestor HEAD origin/main

      # Cheap check first, before the Nix install and Wasm build.
      - name: Verify tag matches package.json version
        working-directory: keyhive_wasm
        run: |
          pkg_version="$(jq -r .version package.json)"
          # Tags look like keyhive-wasm/0.2.0-alpha.1
          tag="${GITHUB_REF_NAME#keyhive-wasm/}"
          if [ "$tag" != "$pkg_version" ]; then
            echo "::error::tag version '$tag' != package.json version '$pkg_version'"
            exit 1
          fi

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: inkandswitch
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build and smoke-test the npm package
        run: nix build .#keyhive-js --no-update-lock-file --print-build-logs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: result/keyhive.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: npm-artifacts

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1.
      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@11.20.0 --ignore-scripts

      # Re-running after a successful publish is a no-op. A failed registry
      # lookup aborts rather than being read as "not yet published".
      - name: Publish (skipped if already published)
        run: |
          set -euo pipefail
          # Absolute: npm reads a bare `dir/file.tgz` as GitHub shorthand.
          tarball="$(realpath npm-artifacts/keyhive.tgz)"
          manifest="$(tar -xOzf "$tarball" package/package.json)"
          name="$(jq -r .name <<<"$manifest")"
          version="$(jq -r .version <<<"$manifest")"
          expected="${GITHUB_REF_NAME#keyhive-wasm/}"
          if [ "$name" != "@keyhive/keyhive" ] || [ "$version" != "$expected" ]; then
            echo "::error::tarball contains $name@$version, expected @keyhive/keyhive@$expected"
            exit 1
          fi

          published="$(npm view "$name@$version" version)"
          if [ -n "$published" ]; then
            echo "$name@$version is already published."
            exit 0
          fi

          # Dist-tag follows the version, not the GitHub "pre-release"
          # checkbox: a semver pre-release goes to `next` so
          # `npm install @keyhive/keyhive` never resolves to an alpha.
          tag_args=()
          if [[ "$version" == *-* ]]; then
            tag_args=(--tag next)
          fi
          npm publish "$tarball" --ignore-scripts --access public --provenance "${tag_args[@]}"
