[package]

name = "keyhive_core"
version = "0.8.0"
description = "Core Keyhive types and functions"

authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]

# Keyhive
beekem = { workspace = true, features = ["std"] }
keyhive_codec = { workspace = true, features = ["std"] }
keyhive_crypto = { workspace = true, features = ["std"] }
keyline = { workspace = true, features = ["std"] }
# The in-memory Keyline store, for the test helpers.
keyline_memory = { workspace = true, features = ["std"], optional = true }

# Docs
aquamarine = { workspace = true, optional = true }

# Encoding

# Crypto
blake3 = { workspace = true, features = ["std"] }
chacha20poly1305 = { workspace = true }
ed25519-dalek = { workspace = true, features = ["fast", "rand_core", "std", "zeroize"] }
rand = { workspace = true, features = ["std", "std_rng"] }
signature = { workspace = true }
x25519-dalek = { workspace = true }

# Error Handling
thiserror = { workspace = true }

# Utilities
async-lock = { workspace = true }
derivative = { workspace = true }
derive_more = { workspace = true, features = ["std"] }
derive-where = { workspace = true }
dupe = { workspace = true }
future_form = { workspace = true }
futures = { workspace = true, features = ["async-await", "executor", "std"] }
imbl = { workspace = true }
nonempty = { workspace = true }
tracing = { workspace = true, features = ["attributes", "std"] }

# Testing
proptest = { workspace = true, optional = true }
proptest-derive = { workspace = true, optional = true }
arbitrary = { workspace = true, optional = true }
prettytable-rs = { workspace = true, optional = true }

[dev-dependencies]
beekem = { workspace = true, features = ["arbitrary", "std"] }
keyhive_codec = { workspace = true, features = ["laws", "std"] }
keyhive_core = { path = ".", features = ["test_utils", "debug_events"] }
keyhive_crypto = { workspace = true, features = ["arbitrary", "std"] }
test-utils = { workspace = true }

arbitrary.workspace = true
bolero.workspace = true
keyline = { workspace = true, features = ["arbitrary", "std", "test_utils"] }
keyline_memory = { workspace = true, features = ["std"] }
lazy_static = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync"] }
tokio-test = { workspace = true }

# Benchmarks
divan = { workspace = true }

# Test Helpers
hex.workspace = true
pretty_assertions = { workspace = true }
testresult = { workspace = true }
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter"] }

[features]
default = []
arbitrary = ["dep:arbitrary", "keyline/arbitrary"]
debug_events = ["prettytable-rs"]
mermaid_docs = ["aquamarine"]
test_utils = ["beekem/test_utils", "dep:keyline_memory", "proptest", "proptest-derive"]

[[bench]]
name = "bench_cgka"
harness = false
required-features = ["test_utils"]

[[bench]]
name = "bench_reachable_prekey_ops"
harness = false
required-features = ["test_utils"]

[[bench]]
name = "bench_toggling_delegate_revoke"
harness = false
required-features = ["test_utils"]

[[bench]]
name = "bench_ingest_unsorted_static_events"
harness = false
required-features = ["test_utils"]

[[bench]]
name = "bench_reachable_prekey_ops_all"
harness = false
required-features = ["test_utils"]

[[bench]]
name = "bench_event_selection"
harness = false
required-features = ["test_utils"]

[[bench]]
name = "bench_cgka_propagation"
harness = false
required-features = ["test_utils"]

[lints]
workspace = true
