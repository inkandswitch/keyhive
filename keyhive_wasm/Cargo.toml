[package]
name = "keyhive_wasm"
version = "0.4.0"
description = "WebAssembly wrappers for keyhive_core"

authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
beekem = { workspace = true, features = ["std"] }
from_js_ref = { workspace = true }
keyhive_core = { workspace = true }
keyhive_crypto = { workspace = true, features = ["std"] }
wasm_refgen = { workspace = true }

base64-simd = { workspace = true }
bincode = { workspace = true }
derive_more = { workspace = true, features = ["std"] }
dupe = { workspace = true }
future_form = { workspace = true }
ed25519-dalek = { workspace = true, features = ["fast", "rand_core", "serde", "std", "zeroize"] }
futures = { workspace = true, features = ["async-await", "executor", "std"] }
nonempty = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive", "rc", "std"] }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true, features = ["attributes", "std"] }
wasm-tracing = { workspace = true }

rand = { workspace = true, features = ["std", "std_rng"] }
getrandom = { workspace = true, features = ["js"] }

console_error_panic_hook = { workspace = true, optional = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[dependencies.web-sys]
workspace = true
features = [
    "Crypto",
    "CryptoKey",
    "CryptoKeyPair",
    "Storage",
    "SubtleCrypto",
    "Window",
    "console",
]
optional = true

[dev-dependencies]
wasm-bindgen-test = { workspace = true }

[dev-dependencies.web-sys]
workspace = true
features = [
    "Crypto",
    "CryptoKey",
    "CryptoKeyPair",
    "Storage",
    "SubtleCrypto",
    "Window",
    "console",
]
optional = false

[features]
default = ["console_error_panic_hook", "web-sys", "json"]
browser_test = []
json = ["dep:serde_json"]
