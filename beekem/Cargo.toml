[package]
name = "beekem"
version = "0.5.0"
description = "BeeKEM: a concurrent variant of TreeKEM for Continuous Group Key Agreement"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = { workspace = true }
chacha20poly1305 = { workspace = true }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
future_form = { workspace = true }
keyhive_codec = { workspace = true }
keyhive_crypto = { workspace = true }
nonempty = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true, features = ["attributes"] }

# std-only dependencies
dupe = { workspace = true, optional = true }
thiserror = { workspace = true }

arbitrary = { workspace = true, optional = true }

[dev-dependencies]
arbitrary = { workspace = true }
bolero.workspace = true
beekem = { path = ".", features = ["arbitrary"] }
curve25519-dalek = { workspace = true }
keyhive_codec = { workspace = true, features = ["laws"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = ["std"]
std = [
    "blake3/std",
    "dupe",
    "ed25519-dalek/std",
    "keyhive_codec/std",
    "keyhive_crypto/std",
    "nonempty/std",
    "rand/std",
    "rand/std_rng",
    "thiserror/std",
    "tracing/std",
]
arbitrary = ["dep:arbitrary", "keyhive_crypto/arbitrary"]
test_utils = ["rand/std_rng"]

[lints]
workspace = true
