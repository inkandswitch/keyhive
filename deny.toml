# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[licenses]
# Alphabetized. Everything must be compatible with Apache-2.0.
allow = ["Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "MIT", "Unicode-3.0"]

[advisories]
ignore = [
  # bincode 1.3.3: development ceased; the team considers 1.3.3 complete.
  # It is Keyhive's wire encoding. Replacing it is a breaking format
  # change; a no_std serializer (minicbor / postcard) is the planned replacement.
  { id = "RUSTSEC-2025-0141", reason = "chosen wire encoding; migration tracked separately" },

  # derivative: unmaintained proc-macro used in keyhive_core. Compile-time
  # only — no runtime attack surface. beekem/keyhive_crypto already
  # replaced it with manual impls; keyhive_core migration is pending.
  { id = "RUSTSEC-2024-0388", reason = "compile-time only; migration pending" },

  # proc-macro-error2: transitive via `aquamarine` (`mermaid_docs`
  # feature, rustdoc only). Compile-time only.
  { id = "RUSTSEC-2026-0173", reason = "transitive compile-time dep of aquamarine (docs feature)" },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  # Pinned commit with `console` log-level support until the next release
  "https://github.com/dsgallups/wasm-tracing",
]
