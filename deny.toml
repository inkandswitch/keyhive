# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[licenses]
# Alphabetized. Everything must be compatible with Apache-2.0.
allow = ["Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "MIT", "Unicode-3.0"]

[[licenses.exceptions]]
crate = "imbl"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "imbl-sized-chunks"
allow = ["MPL-2.0"]

[advisories]
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  # Pinned commit with `console` log-level support until the next release
  "https://github.com/dsgallups/wasm-tracing",
]
