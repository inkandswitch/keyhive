[package]
name = "keyline_memory"
version = "0.1.0"
description = "The in-memory reference backend for Keyline"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-lock = { workspace = true }
future_form = { workspace = true }
# `#[future_form]` expands to paths in `futures`.
futures = { workspace = true }
keyhive_codec = { workspace = true }
keyhive_crypto = { workspace = true }
keyline = { workspace = true }
# `race::OnceBox` holds the evaluation cache; it is `Sync` and needs no `std`.
once_cell = { workspace = true }
tracing = { workspace = true, features = ["attributes"] }

[dev-dependencies]
divan = { workspace = true }
# The scenarios run in every configuration, including `--no-default-features`.
keyline = { workspace = true, features = ["conformance"] }

[features]
default = ["std"]
std = [
  "async-lock/std",
  "keyhive_codec/std",
  "keyhive_crypto/std",
  "keyline/std",
  "once_cell/std",
  "tracing/std",
]
# The full conformance suite, including the `bolero` laws.
test_utils = ["keyline/test_utils"]

[[bench]]
name = "bench_evaluate"
harness = false
